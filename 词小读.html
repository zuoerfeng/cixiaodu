const curated={
achievement:['/əˈtʃiːvmənt/','n. 成就；成绩','重音在 /tʃiːv/。achieve 中的 ch 发 /tʃ/，ie 发 /iː/；末尾 -ment 中的元音弱读。','achieve（实现）+ -ment（构成名词）→ achievement。','Winning the competition was a great achievement.'],
challenge:['/ˈtʃælɪndʒ/','n. 挑战；v. 向……挑战','重音在第一个音节 /tʃæl/。ch 发 /tʃ/，词尾 ge 在这个词中发 /dʒ/。','常见搭配：face a challenge（面对挑战）。','Learning a new language is a challenge.'],
confident:['/ˈkɑːnfɪdənt/','adj. 自信的','这是美式音标，重音在第一个音节；后面的元音较轻，末尾 /dənt/ 不要读得太重。','be confident about…：对……有信心；名词是 confidence。','She feels confident about the exam.'],

opportunity:['/ˌɑːpərˈtuːnəti/','n. 机会','这是美式音标。主重音在 /tuː/，开头有次重音；中间和末尾注意弱读。','an opportunity to do something：做某事的机会。','This is an opportunity to learn something new.'],
environment:['/ɪnˈvaɪrənmənt/','n. 环境','重音在 /vaɪ/；不要根据拼写把每一个字母都单独读出来。后半部分元音弱读。','protect the environment：保护环境。','We can work together to protect the environment.'],

function loadVoices(){if(!synth){$('#voice').append(el('option','设备不支持语音'));return}const old=$('#voice').value;voices=synth.getVoices().filter(v=>v.lang.startsWith('en'));$('#voice').replaceChildren();const preferred=voices.filter(v=>v.lang===$('#accent').value);(preferred.length?preferred:voices).forEach(v=>{const o=el('option',v.name);o.value=v.name;$('#voice').append(o)});if([...$('#voice').options].some(o=>o.value===old))$('#voice').value=old;if(!voices.length)$('#voice').append(el('option','等待英语声音…'))}

function stop(){generation++;if(dictionaryAudio){dictionaryAudio.pause();dictionaryAudio=null}if(synth)synth.cancel();utterance=null;paused=false;$('#pause').textContent='Ⅱ';$('#player').classList.remove('visible');document.querySelectorAll('.sentence.active').forEach(n=>n.classList.remove('active'))}

function speak(text,rows=[],start=0,only=false){stop();if(!synth){say('这台设备不支持浏览器朗读，请换用最新版 Chrome 或 Safari。');return}loadVoices();if(!voices.length){say('设备还没有可用的英语声音。请在系统语音设置中安装英语声音，再重新播放。');return}const token=generation;const parts=sentences(text);const end=only?Math.min(start+1,parts.length):parts.length;function next(i){if(token!==generation)return;if(i>=end){stop();return}document.querySelectorAll('.sentence.active').forEach(n=>n.classList.remove('active'));if(rows[i]){rows[i].classList.add('active');rows[i].scrollIntoView({block:'nearest',behavior:'smooth'})}utterance=new SpeechSynthesisUtterance(parts[i]);utterance.lang=$('#accent').value;utterance.voice=voices.find(v=>v.name===$('#voice').value)||voices.find(v=>v.lang===$('#accent').value)||voices[0];utterance.rate=Number($('#rate').value);utterance.onend=()=>next(i+1);utterance.onerror=e=>{if(token!==generation)return;stop();if(e.error!=='canceled'&&e.error!=='interrupted')say('刚才的朗读没有成功（'+e.error+'）。可以换一个声音再试。')};$('#player').classList.add('visible');$('#playstate').textContent='正在朗读 · 第 '+(i+1)+' / '+parts.length+' 句';synth.speak(utterance)}next(start)}
function renderPassage(text){lastText=text;const body=say('好，我们读这一段。先听一遍，再挑一句跟着读。');const rows=[];sentences(text).forEach((s,i)=>{const b=button(s,()=>speak(text,rows,i,true));b.className='sentence';b.title='朗读这一句';rows.push(b);body.append(b)});const a=el('div',undefined,'actions');a.append(button('▶ 朗读全文',()=>speak(text,rows)),button('▶ 慢速朗读',()=>{$('#rate').value='0.7';speak(text,rows)}));body.append(a);scroll()}
function renderWord(word,data,local){lastWord=word;lastData=data;lastText=word;const body=say('我们把读音、意思和情境连起来看看。');const head=el('div',undefined,'word-head');const name=el('div');name.append(el('div',word,'word-title'),el('div',data.phonetic||'词典未提供音标','phonetic'));const play=button('▶',()=>listenWord(word,data));play.className='pronunciation';play.title='播放单词读音';play.setAttribute('aria-label','播放 '+word+' 的读音');head.append(name,play);body.append(head,sectionTitle('单词释义'));let example='',translation='';if(local){body.append(el('div',local[1],'entry'),sectionTitle('拼读与理解'),el('p',local[2]),el('p',local[3]));example=visualWords[word]?.example||local[4];translation=visualWords[word]?.translation||exampleTranslations[word]||''}else{data.meanings?.slice(0,3).forEach(m=>{const d=m.definitions?.[0];if(!d)return;const e=el('div',undefined,'entry');e.append(el('strong',m.partOfSpeech),el('div',d.definition));body.append(e);if(!example)example=m.definitions.find(x=>x.example)?.example||''});body.append(el('p','当前展示词典英文释义；暂无内置中文拼读讲解。音标中的 ˈ 标在主重读音节前。','muted'))}body.append(sectionTitle('例句'));if(example){const line=el('div',undefined,'example-line');line.append(el('div',example),button('▶',()=>speak(example)));line.lastChild.title='朗读例句';line.lastChild.setAttribute('aria-label','朗读例句');body.append(line);if(translation)body.append(el('div',translation,'example-translation'))}else body.append(el('p','词典没有提供这个词的例句，暂不编造。','muted'));const visual=el('div',undefined,'visual-section');body.append(visual);renderVisual(word,visual);const a=el('div',undefined,'actions');a.append(button('▶ 慢速读词',()=>{$('#rate').value='0.7';speak(word)}),button('考考我',()=>submit('考考我')));body.append(a,el('div',local?'教学内容：内置词条 · 声音：设备英语语音':'释义与例句：Free Dictionary API · 声音：词典录音或设备语音','source'));scroll()}
async function lookup(word,token){const local=curated[word];if(local){renderWord(word,{phonetic:local[0]},local);return}const cached=dictionaryCache[word];if(cached&&Array.isArray(cached.meanings)&&cached.meanings.length){renderWord(word,cached,null);return}const loading=say('我去词典里找一下 “'+word+'”…');loading.classList.add('loading');const controller=new AbortController();const timeout=setTimeout(()=>controller.abort(),9000);try{const r=await fetch('https://api.dictionaryapi.dev/api/v2/entries/en/'+encodeURIComponent(word),{signal:controller.signal});if(token!==requestGeneration)return;if(!r.ok){if(r.status===404){loading.textContent='词典没有收录 “'+word+'”。可以检查拼写，也可以先听读音。';loading.append(button('▶ 先听读音',()=>speak(word)))}else lookupFailed(word,loading,'在线词典返回错误（'+r.status+'），这次没查成功。');return}const result=await r.json();if(token!==requestGeneration)return;if(!Array.isArray(result[0]?.meanings)||!result[0].meanings.length)throw Error('invalid');const data={...result[0],phonetic:result[0].phonetic||result[0].phonetics?.find(p=>p.text)?.text};dictionaryCache[word]=data;try{localStorage.setItem('cx-dictionary-cache',JSON.stringify(dictionaryCache))}catch{}loading.parentElement.remove();renderWord(word,data,null)}catch(e){if(token===requestGeneration)lookupFailed(word,loading,e.name==='AbortError'?'在线词典查询超时。':'在线词典请求失败，可能是网络连接或浏览器访问限制。')}finally{clearTimeout(timeout)}}
async function submit(raw){const text=raw.trim();if(!text||busy)return;busy=true;const token=requestGeneration;add(text,true);$('#input').value='';$('#input').style.height='55px';try{if(/^(你好|嗨|hello|hi)[！!。\s]*$/i.test(text)){say('嗨，你来啦。今天想认识哪个单词，还是一起读一段课文？');return}if(/谢谢|再见/.test(text)){say('不客气。今天多读懂一点，就很不错了。下次遇到生词再来找我。');return}if(/慢一点|慢点|再读|再来一遍|重读|快一点/.test(text)&&!/[a-z]{2}/i.test(text)){if(!lastText){say('好呀，先告诉我想读的单词，或发来英文原文。');return}$('#rate').value=/快/.test(text)?'1.2':/慢/.test(text)?'0.7':$('#rate').value;say(/慢/.test(text)?'好，我们放慢一点。点下面的播放按钮，跟着听就好。':'没问题，我们再听一遍。').append(button('▶ 播放',()=>speak(lastText)));return}if(/暂停|停止/.test(text)){stop();say('停下来啦，准备好了我们再继续。');return}if(/考考我|练习|测验/.test(text)){if(!lastWord){say('先认识一个词再来小测。要不要从 challenge 开始？').append(button('学习 challenge',()=>submit('challenge')));return}const local=curated[lastWord];const answer=local?local[1]:lastData?.meanings?.[0]?.definitions?.[0]?.definition;const b=say('不看上面的答案，试着说出 “'+lastWord+'” 的意思。想好后再揭晓。');b.append(button('揭晓答案',()=>{b.append(el('div',answer||'这个词没有可用释义。','entry'))}));return}const book=books.find(b=>text.includes(b.title));if(book&&/读|朗读|播放/.test(text)){renderPassage(book.text);return}const english=text.match(/[A-Za-z]+(?:['’-][A-Za-z]+)*/g)||[];if(english.length>=4){const original=text.replace(/^[\s\S]*?(?=[A-Za-z])/,'');renderPassage(original);return}if(/课文|朗读|必修|第.*段/.test(text)&&english.length!==1){say('可以。把英文原文发给我，或用右上角“＋ 课文”保存它。我还没有你的教材，不能只凭课文名称确定原文。');return}if(english.length===1){await lookup(english[0].toLowerCase(),token);return}if(/意思|例句|记住|怎么记/.test(text)&&lastWord){renderWord(lastWord,lastData,curated[lastWord]);return}say('我现在最擅长查单词和读英文。你可以问“challenge 怎么读”，或直接发一段英文让我朗读。自由聊天和任意句子讲解还没有接入。')}finally{if(token===requestGeneration)busy=false;scroll()}}
